<svg width="480" height="380" viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2F6FED" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B700" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5B700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0A0E1A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#0B1122" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0A0E1A" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="480" height="380" fill="url(#bg3)"/>
  <rect width="480" height="380" fill="url(#grid3)"/>

  <g transform="translate(0,-30) translate(240,150) scale(1.1) translate(-240,-150)">
  <!-- neural network, compressed into upper field -->
  <g stroke="#2F6FED" stroke-width="1.5" stroke-opacity="0.55">
    <path d="M100 90 L240 130"/>
    <path d="M100 170 L240 130"/>
    <path d="M100 90 L100 170"/>
    <path d="M240 130 L380 70"/>
    <path d="M240 130 L380 130"/>
    <path d="M240 130 L380 190"/>
    <path d="M380 70 L380 130"/>
    <path d="M380 130 L380 190"/>
  </g>

  <circle cx="240" cy="130" r="55" fill="url(#glow3)"/>
  <circle cx="100" cy="90" r="8" fill="#2F6FED"/>
  <circle cx="100" cy="170" r="8" fill="#2F6FED"/>
  <circle cx="380" cy="70" r="8" fill="#2F6FED"/>
  <circle cx="380" cy="130" r="8" fill="#2F6FED"/>
  <circle cx="380" cy="190" r="8" fill="#2F6FED"/>
  <circle cx="240" cy="130" r="13" fill="#F5B700"/>
  </g>

  <!-- baked-in bottom fade so overlay text always sits on a clean field -->
  <rect x="0" y="130" width="480" height="250" fill="url(#scrim3)"/>
</svg>
