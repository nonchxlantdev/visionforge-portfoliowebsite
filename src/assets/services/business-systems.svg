<svg width="480" height="380" viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <pattern id="grid5" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2F6FED" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scrim5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0A0E1A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#0B1122" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0A0E1A" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="480" height="380" fill="url(#bg5)"/>
  <rect width="480" height="380" fill="url(#grid5)"/>

  <g transform="translate(0,-30) translate(240,150) scale(1.1) translate(-240,-150)">
  <!-- central hub, shifted up -->
  <rect x="200" y="90" width="80" height="60" rx="8" fill="#0B1122" stroke="#F5B700" stroke-width="2"/>
  <rect x="220" y="108" width="40" height="8" rx="2" fill="#F5B700" opacity="0.6"/>
  <rect x="220" y="122" width="26" height="6" rx="2" fill="#F5B700" opacity="0.35"/>

  <!-- satellite nodes, kept in upper field -->
  <rect x="80" y="55" width="66" height="46" rx="6" fill="#0B1122" stroke="#2F6FED" stroke-width="1.5"/>
  <rect x="334" y="55" width="66" height="46" rx="6" fill="#0B1122" stroke="#2F6FED" stroke-width="1.5"/>

  <!-- connectors -->
  <g stroke="#2F6FED" stroke-width="1.5" stroke-opacity="0.55" fill="none">
    <path d="M146 78 L200 110"/>
    <path d="M334 78 L280 110"/>
  </g>
  <circle cx="113" cy="78" r="4" fill="#2F6FED"/>
  <circle cx="367" cy="78" r="4" fill="#2F6FED"/>
  </g>

  <!-- baked-in bottom fade so overlay text always sits on a clean field -->
  <rect x="0" y="130" width="480" height="250" fill="url(#scrim5)"/>
</svg>
