  <rect x="90" y="166" width="120" height="8" rx="3" fill="#2F6FED" opacity="0.2"/>
  <rect x="90" y="192" width="70" height="26" rx="6" fill="#F5B700" opacity="0.85"/>

  <!-- phone / app -->
  <rect x="270" y="150" width="120" height="200" rx="18" fill="#0B1122" stroke="#F5B700" stroke-width="1.5"/>
  <rect x="282" y="170" width="96" height="150" rx="6" fill="#10162A"/>
