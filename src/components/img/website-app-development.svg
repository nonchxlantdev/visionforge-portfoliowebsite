<svg width="480" height="380" viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <pattern id="grid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2F6FED" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scrim1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0A0E1A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#0B1122" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0A0E1A" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="480" height="380" fill="url(#bg1)"/>
  <rect width="480" height="380" fill="url(#grid1)"/>

  <!-- browser window -->
  <rect x="70" y="70" width="260" height="180" rx="10" fill="#0B1122" stroke="#2F6FED" stroke-width="1.5"/>
