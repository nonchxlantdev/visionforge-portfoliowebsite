<svg width="480" height="380" viewBox="0 0 480 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2F6FED" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scrim2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0A0E1A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#0B1122" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0A0E1A" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="480" height="380" fill="url(#bg2)"/>
  <rect width="480" height="380" fill="url(#grid2)"/>

  <!-- gear, shifted up -->
  <g transform="translate(240,150)">
    <g stroke="#2F6FED" stroke-width="2" fill="none">
      <circle r="70"/>
      <circle r="34"/>
      <g id="teeth2">
        <rect x="-8" y="-92" width="16" height="26" fill="#0B1122" stroke="#2F6FED"/>
      </g>
    </g>
    <use href="#teeth2" transform="rotate(45)"/>
    <use href="#teeth2" transform="rotate(90)"/>
    <use href="#teeth2" transform="rotate(135)"/>
    <use href="#teeth2" transform="rotate(180)"/>
    <use href="#teeth2" transform="rotate(225)"/>
    <use href="#teeth2" transform="rotate(270)"/>
    <use href="#teeth2" transform="rotate(315)"/>
    <circle r="10" fill="#F5B700"/>
  </g>

  <!-- connector nodes, kept in upper field -->
  <circle cx="80" cy="70" r="7" fill="#2F6FED" opacity="0.8"/>
  <circle cx="400" cy="70" r="7" fill="#F5B700" opacity="0.8"/>
  <path d="M80 70 L172 118" stroke="#2F6FED" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M400 70 L308 118" stroke="#F5B700" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- baked-in bottom fade so overlay text always sits on a clean field -->
  <rect x="0" y="130" width="480" height="250" fill="url(#scrim2)"/>
</svg>
